version: "3.9"

services:
  mch-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mch_gap_intelligence
    ports:
      - "8501:8501"
    environment:
      - MPLCONFIGDIR=/tmp/matplotlib
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist generated outputs between restarts
      - ./outputs:/app/outputs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
